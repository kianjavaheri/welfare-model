<text x="100" y="947" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#52514e">Each bar counts mothers by their own estimated effect. n = 160, all estimates positive &#8212; but the interval on the average includes zero.</text>
<text x="100" y="978" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#898781">Read the spread as suggestive of heterogeneity, not as per-mother predictions.</text>
